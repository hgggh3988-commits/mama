<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ست الكل ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            /* خلفية غامقة فخمة ودافية (عنابي داكن مع درجات توتية ملكية) */
            background: linear-gradient(135deg, #2b0b18 0%, #1a050f 50%, #0f0208 100%);
            background-attachment: fixed;
            color: #fce4ec;
            text-align: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* شاشة البداية */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-img-box {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(45deg, #d4af37, #880e4f);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
        }

        .main-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #2b0b18;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            color: #f8bbd0;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* الأزرار الكبيرة */
        .big-btn {
            background: linear-gradient(45deg, #880e4f, #ad1457);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(136, 14, 79, 0.4);
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .big-btn:active {
            transform: scale(0.95);
        }

        /* الأقسام */
        .section {
            padding: 30px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* كارت الصوت والأغنية (ستايل زجاجي غامق فخم) */
        .audio-card {
            background: rgba(43, 11, 24, 0.7);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* أزرار الصوت والأغنية (لا تتغير للأخضر عند التشغيل) */
        .play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #880e4f, #ad1457);
            color: white;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(136, 14, 79, 0.4);
            margin-bottom: 15px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        /* زرار الأغنية بلون متناسق */
        .song-btn {
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            box-shadow: 0 8px 20px rgba(74, 20, 140, 0.4);
        }

        /* حالة التشغيل (نبض هادي بنفس لون الزرار الأصلي بدل الأخضر) */
        .play-btn.playing {
            animation: customPulse 1.5s infinite;
        }

        @keyframes customPulse {
            0% { box-shadow: 0 0 0 0 rgba(173, 20, 87, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(173, 20, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(173, 20, 87, 0); }
        }

        .song-btn.playing {
            animation: songPulse 1.5s infinite;
        }

        @keyframes songPulse {
            0% { box-shadow: 0 0 0 0 rgba(106, 27, 154, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(106, 27, 154, 0); }
            100% { box-shadow: 0 0 0 0 rgba(106, 27, 154, 0); }
        }

        /* ألبوم الصور */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
        }

        .photo-card {
            background: rgba(43, 11, 24, 0.75);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .photo-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        .photo-caption {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffd700;
        }

        /* شاشة المفاجأة */
        .surprise-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 2, 8, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            padding: 20px;
        }

        .surprise-modal h2 {
            font-size: 2.8rem;
            color: #ffd700;
            margin-bottom: 20px;
            animation: pop 0.5s ease;
        }

        .close-btn {
            margin-top: 30px;
            background: #880e4f;
            color: #fff;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 800;
            border: 1px solid #ffd700;
            cursor: pointer;
        }

        /* قلوب بتطير */
        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 24px;
            animation: flyUp 4s linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes flyUp {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. الشاشة الرئيسية -->
    <div class="hero">
        <div class="main-img-box">
            <img src="main.jpg" alt="أمي">
        </div>
        <h1>ست الكل ❤️</h1>
        <p class="subtitle">بحبك يا أمي</p>
        <button class="big-btn" onclick="startJourney()">اضغطي هنا 👇</button>
    </div>

    <!-- 2. قسم الريكورد / الصوت -->
    <div class="section" id="audio-section">
        <div class="audio-card">
            <button class="play-btn" id="voiceBtn" onclick="toggleVoice()">▶️</button>
            <h2 style="font-size: 1.7rem; color: #ffd700;">اسمعي صوتي 🎙️</h2>
            <audio id="voiceAudio" src="voice.mp3"></audio>
        </div>
    </div>

    <!-- 3. ألبوم الصور (5 صور) -->
    <div class="section">
        <h2 style="margin-bottom: 25px; color: #ffd700; font-size: 2rem;">ذكرياتنا ❤️</h2>
        <div class="gallery">
            <div class="photo-card">
                <img src="pic1.jpg" alt="صورة 1">
                <p class="photo-caption">أحلى ضحكة 😍</p>
            </div>

            <div class="photo-card">
                <img src="pic2.jpg" alt="صورة 2">
                <p class="photo-caption">ربنا يخليكي ليا 🤲</p>
            </div>

            <div class="photo-card">
                <img src="pic3.jpg" alt="صورة 3">
                <p class="photo-caption">أغلى الناس ❤️</p>
            </div>

            <div class="photo-card">
                <img src="pic4.jpg" alt="صورة 4">
                <p class="photo-caption">نور عيني ✨</p>
            </div>

            <div class="photo-card">
                <img src="pic5.jpg" alt="صورة 5">
                <p class="photo-caption">بركة البيت 👑</p>
            </div>
        </div>
    </div>

    <!-- 4. قسم الأغنية (فوق زرار الهدية) -->
    <div class="section">
        <div class="audio-card">
            <button class="play-btn song-btn" id="songBtn" onclick="toggleSong()">🎵</button>
            <h2 style="font-size: 1.7rem; color: #e1bee7;">أغنيتك 🎶</h2>
            <audio id="songAudio" src="song.mp3"></audio>
        </div>
    </div>

    <!-- 5. زرار الهدية -->
    <div class="section">
        <button class="big-btn" style="background: linear-gradient(45deg, #880e4f, #d4af37);" onclick="showSurprise()">
            هديتك 🎁
        </button>
    </div>

    <!-- شاشة المفاجأة -->
    <div class="surprise-modal" id="surpriseModal">
        <div style="font-size: 5rem; margin-bottom: 15px;">💐❤️👑</div>
        <h2>ربنا يديمك نعمة</h2>
        <p style="font-size: 1.6rem;">في حياتي يا ست الكل</p>
        <button class="close-btn" onclick="closeSurprise()">إغلاق</button>
    </div>

    <script>
        const voiceAudio = document.getElementById('voiceAudio');
        const voiceBtn = document.getElementById('voiceBtn');

        const songAudio = document.getElementById('songAudio');
        const songBtn = document.getElementById('songBtn');

        function startJourney() {
            document.getElementById('audio-section').scrollIntoView({ behavior: 'smooth' });
            playVoice();
            launchHearts(15);
        }

        // التحكم في الريكورد
        function toggleVoice() {
            if (voiceAudio.paused) {
                playVoice();
            } else {
                pauseVoice();
            }
        }

        function playVoice() {
            pauseSong(); 
            voiceAudio.play().then(() => {
                voiceBtn.innerHTML = '⏸️';
                voiceBtn.classList.add('playing');
            }).catch(e => console.log(e));
        }

        function pauseVoice() {
            voiceAudio.pause();
            voiceBtn.innerHTML = '▶️';
            voiceBtn.classList.remove('playing');
        }

        voiceAudio.onended = pauseVoice;

        // التحكم في الأغنية
        function toggleSong() {
            if (songAudio.paused) {
                playSong();
            } else {
                pauseSong();
            }
        }

        function playSong() {
            pauseVoice(); 
            songAudio.play().then(() => {
                songBtn.innerHTML = '⏸️';
                songBtn.classList.add('playing');
            }).catch(e => console.log(e));
        }

        function pauseSong() {
            songAudio.pause();
            songBtn.innerHTML = '🎵';
            songBtn.classList.remove('playing');
        }

        songAudio.onended = pauseSong;

        // شاشة المفاجأة
        function showSurprise() {
            document.getElementById('surpriseModal').style.display = 'flex';
            launchHearts(30);
        }

        function closeSurprise() {
            document.getElementById('surpriseModal').style.display = 'none';
        }

        function launchHearts(count) {
            const emojis = ['❤️', '🌹', '💐', '✨', '👑'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
